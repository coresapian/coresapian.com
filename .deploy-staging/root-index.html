  <body>
    <main class="shell">
      <section class="shell__stage">
        <div class="game-frame">
          <audio
            id="ambient-audio"
            preload="metadata"
            loop
            playsinline
            src="/orchastra-cinematic-001.mp3?v=ea2d8146"
          ></audio>

          <canvas id="canvas">
            browser not supported
          </canvas>

          <noscript>
            browser not supported
          </noscript>

          <!-- ═══ Loading Screen ═══ -->
          <div id="loader">
            <div class="loader__glow"></div>
            <div class="loader__content">
              <div class="loader__symbol">⟁</div>
              <div class="loader__title">CORESAPIAN</div>
              <div class="loader__progress-wrap">
                <div class="loader__progress">
                  <div class="loader__progress-fill" id="loader-fill"></div>
                </div>
                <div class="loader__percent" id="loader-percent">0%</div>
              </div>
              <div class="loader__status" id="loader-status">Initializing engine</div>
            </div>
            <div class="loader__error" id="loader-error" hidden>
              <div class="loader__error-text" id="loader-error-text">Connection failed</div>
              <div class="loader__error-hint">tap to retry</div>
            </div>
          </div>

          <!-- ═══ Anonymous Chat Panel ═══ -->
          <button id="chat-toggle" class="chat-toggle" type="button" hidden>
            <span class="chat-toggle__icon">⌘</span>
            <span class="chat-toggle__dot is-connecting" id="chat-status-dot"></span>
            <span class="chat-toggle__badge" id="chat-badge" hidden>0</span>
          </button>
          <div id="chat-panel" class="chat-panel is-hidden">
            <div class="chat-panel__header">
              <span>// CHAN_0</span>
              <button id="chat-close" class="chat-panel__close" type="button">✕</button>
            </div>
            <div class="chat-panel__messages" id="chat-messages"></div>
            <div class="chat-panel__input-row">
              <span class="chat-panel__prompt">&gt;_</span>
              <input id="chat-input" class="chat-panel__input" type="text"
                placeholder="type @ai for AI, or chat..." maxlength="500"
                autocomplete="off" autocorrect="off" autocapitalize="off"
                spellcheck="false">
              <button id="chat-send" class="chat-panel__send" type="button">⏎</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
