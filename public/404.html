<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Branch Not Found · CoreSapian Inc.</title>
  <meta name="description" content="The page you requested could not be found. Return to the CoreSapian lab.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#FF8C00">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #0a0a0a;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    /* ── Full-viewport scanline overlay ── */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 0px,
        rgba(255, 255, 255, 0) 2px,
        rgba(255, 255, 255, 0.03) 2px,
        rgba(255, 255, 255, 0.03) 4px
      );
    }

    /* ── CRT curvature vignette ── */
    .crt-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 2rem;
    }

    .crt-screen {
      position: relative;
      max-width: 720px;
      width: 100%;
      border-radius: 18px;
      padding: 3rem 2rem;
      text-align: center;

      /* Curvature / vignette illusion */
      box-shadow:
        inset 0 0 120px 60px rgba(0, 0, 0, 0.55),
        inset 0 0 30px 10px rgba(0, 0, 0, 0.4),
        0 0 40px rgba(255, 140, 0, 0.06);

      /* Flicker animation */
      animation: crtFlicker 0.15s infinite alternate;
    }

    @keyframes crtFlicker {
      0%   { opacity: 0.97; }
      50%  { opacity: 1.0; }
      100% { opacity: 0.98; }
    }

    /* ── Runic header ── */
    .runes-top {
      font-size: clamp(0.65rem, 1.8vw, 0.9rem);
      color: #8B6914;
      letter-spacing: 0.3em;
      margin-bottom: 1.8rem;
      user-select: none;
    }

    /* ── 404 number ── */
    .error-code {
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: bold;
      color: #FFB000;
      text-shadow:
        0 0 40px #FF8C00,
        0 0 80px #FF8C00,
        0 0 120px #FF6600;
      line-height: 1;
      margin-bottom: 0.6rem;
      letter-spacing: -0.04em;
    }

    /* ── Heading ── */
    .heading {
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      color: #FFB000;
      text-shadow: 0 0 18px #FF8C00, 0 0 36px #CC6600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 1.4rem;
    }

    /* ── Sub message ── */
    .sub-message {
      font-size: clamp(0.8rem, 2vw, 1rem);
      color: #8B6914;
      line-height: 1.7;
      margin-bottom: 1.2rem;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Runic line ── */
    .runes-bottom {
      font-size: clamp(0.6rem, 1.6vw, 0.8rem);
      color: #8B6914;
      letter-spacing: 0.3em;
      margin-bottom: 2rem;
      user-select: none;
    }

    /* ── Return link ── */
    .return-link {
      display: inline-block;
      color: #FFB000;
      text-decoration: none;
      font-size: clamp(0.9rem, 2.2vw, 1.05rem);
      letter-spacing: 0.12em;
      padding: 0.6em 1.4em;
      border: 1px solid rgba(255, 176, 0, 0.25);
      border-radius: 6px;
      transition:
        color 0.2s,
        text-shadow 0.2s,
        border-color 0.2s,
        box-shadow 0.2s;
      margin-bottom: 2.5rem;
    }

    .return-link:hover,
    .return-link:focus-visible {
      color: #FFD700;
      text-shadow: 0 0 16px #FF8C00, 0 0 32px #FF8C00;
      border-color: rgba(255, 140, 0, 0.6);
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.15);
      outline: none;
    }

    /* ── ASCII raven ── */
    .ascii-raven {
      font-size: clamp(0.45rem, 1.2vw, 0.55rem);
      color: #5C4A1E;
      line-height: 1.15;
      margin-bottom: 1.8rem;
      user-select: none;
      white-space: pre;
    }

    /* ── Footer ── */
    .footer {
      font-size: clamp(0.55rem, 1.4vw, 0.7rem);
      color: #4A3B1A;
      letter-spacing: 0.1em;
    }

    .footer hr {
      border: none;
      border-top: 1px solid rgba(139, 105, 20, 0.2);
      margin: 0 auto 0.8rem;
      max-width: 380px;
    }

    /* ── Mobile tweaks ── */
    @media (max-width: 480px) {
      .crt-screen {
        padding: 2rem 1rem;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Scanline overlay -->
  <div class="scanlines" aria-hidden="true"></div>

  <!-- CRT content -->
  <div class="crt-container">
    <div class="crt-screen">

      <!-- Runic top border -->
      <p class="runes-top">&#5794;&#5855;&#5840;&#5800;&#5795;&#5794;&#5793;&#5810;&#5794;&#5855;&#5807;&#5845;&#5817;&#5848;</p>

      <!-- 404 -->
      <p class="error-code">404</p>

      <!-- Heading -->
      <p class="heading">BRANCH NOT FOUND</p>

      <!-- Nordic message -->
      <p class="sub-message">
        You have fallen from the World Tree.<br>
        This path is not woven into the Wyrd.
      </p>

      <!-- Runic line -->
      <p class="runes-bottom">&#5833;&#5810;&#5809;&#5796;&#5845;&#5793;&#5794;&#5793;&#5810;&#5796;&#5845;&#5809;&#5799;&#5795;&#5807;&#5793;&#5845;&#5820;&#5817;&#5822;&#5800;&#5807;&#5820;&#5848;&#5800;</p>

      <!-- Return link -->
      <a class="return-link" href="/">&rlarr; Return to where you came.</a>

      <!-- Footer -->
      <footer class="footer">
        <hr>
        coresapian inc &middot; 2026
      </footer>

    </div>
  </div>

</body>
</html>
