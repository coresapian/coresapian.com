# Hintze Hall Explorer - Configuration
# Tune these values without rebuilding.

player:
  height: 1.7
  eye_height: 1.6
  radius: 0.4
  walk_speed: 4.5
  sprint_speed: 8.0
  mouse_sensitivity: 0.002
  touch_look_multiplier: 0.008
  head_bob_speed: 12.0
  head_bob_amount: 0.04
  gravity: 20.0
  jump_velocity: 7.0

environment:
  model: "hintze_hall.glb"
  background_color: "#111122"
  ambient_intensity: 0.15
  hemisphere_sky_color: "#ccddff"
  hemisphere_ground_color: "#111133"
  hemisphere_intensity: 0.3
  convert_to_basic: false  # Keep PBR materials -- hintze_hall needs real lighting

spawn:
  position: [20, 0, 20]
  yaw: 0

fog:
  enabled: true
  color: "#111122"
  density: 0.003

lights:
  - type: point
    position: [0, 12, 0]
    color: "#ffffff"
    intensity: 2.0
    distance: 50
  - type: point
    position: [10, 8, 10]
    color: "#ffeedd"
    intensity: 1.0
    distance: 30
  - type: point
    position: [-10, 8, -10]
    color: "#ffeedd"
    intensity: 1.0
    distance: 30

pickable_items:
  - id: "blue_gem"
    name: "Sapphire Crystal"
    description: "A brilliant blue gemstone found in the hall."
    icon: "gem"
    color: "#4488ff"
    emissive: "#2244aa"
    position: [3, 1.2, -5]
    scale: 0.3
    shape: "octahedron"
    float_amplitude: 0.15
    float_speed: 2.0
    rotation_speed: 1.5
  - id: "red_gem"
    name: "Ruby Shard"
    description: "A deep red fragment pulsing with warmth."
    icon: "gem"
    color: "#ff4444"
    emissive: "#aa2222"
    position: [-4, 1.2, -8]
    scale: 0.25
    shape: "octahedron"
    float_amplitude: 0.12
    float_speed: 2.5
    rotation_speed: 1.8
  - id: "gold_coin"
    name: "Gold Coin"
    description: "An ancient gold coin with strange markings."
    icon: "coin"
    color: "#ffcc00"
    emissive: "#aa8800"
    position: [6, 1.0, 2]
    scale: 0.2
    shape: "cylinder"
    float_amplitude: 0.1
    float_speed: 1.8
    rotation_speed: 2.0
  - id: "green_herb"
    name: "Moss Bundle"
    description: "A bundle of soft green moss from the hall walls."
    icon: "herb"
    color: "#44cc44"
    emissive: "#228822"
    position: [-2, 1.0, 4]
    scale: 0.25
    shape: "dodecahedron"
    float_amplitude: 0.1
    float_speed: 1.5
    rotation_speed: 1.0
  - id: "silver_key"
    name: "Silver Key"
    description: "An ornate silver key. What does it open?"
    icon: "key"
    color: "#ccccdd"
    emissive: "#8888aa"
    position: [1, 1.5, -12]
    scale: 0.3
    shape: "torus"
    float_amplitude: 0.15
    float_speed: 2.2
    rotation_speed: 1.2
  - id: "purple_scroll"
    name: "Ancient Scroll"
    description: "A weathered scroll with faded writing."
    icon: "scroll"
    color: "#aa66cc"
    emissive: "#663388"
    position: [-6, 1.3, -3]
    scale: 0.2
    shape: "icosahedron"
    float_amplitude: 0.12
    float_speed: 1.6
    rotation_speed: 1.4

interaction:
  pickup_range: 3.0
  pickup_prompt: "[E] Pick up"
  highlight_color: "#ffffff"
  highlight_intensity: 0.3

inventory:
  max_slots: 20
  columns: 5

mobile:
  joystick_size: 120
  joystick_deadzone: 0.15
  look_zone_width_percent: 55
  sprint_button: true
  pause_button: true
  pickup_button: true
