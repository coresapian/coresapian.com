<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CoreSapian Status — The Norns' Loom</title>
  <meta name="description" content="Real-time status and uptime for CoreSapian Inc. services.">
  <meta name="theme-color" content="#FF8C00">
  <meta http-equiv="refresh" content="30">
  <link rel="canonical" href="https://coresapian.com/status/">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Courier New',Courier,monospace;background:#0a0a0a;color:#e0e0e0;min-height:100vh;overflow-x:hidden}

    /* Scanline overlay */
    .scanlines{position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(to bottom,rgba(255,255,255,0) 0px,rgba(255,255,255,0) 2px,rgba(255,255,255,0.03) 2px,rgba(255,255,255,0.03) 4px)}

    .container{max-width:760px;margin:0 auto;padding:24px 16px;animation:crtFlicker 0.15s infinite alternate}
    @keyframes crtFlicker{0%{opacity:0.97}50%{opacity:1}100%{opacity:0.98}}

    /* Header */
    .header{text-align:center;padding:40px 0 32px}
    .runes-header{font-size:13px;color:#8B6914;letter-spacing:0.35em;margin-bottom:12px;user-select:none}
    .header h1{font-size:22px;font-weight:600;letter-spacing:-0.02em;color:#FFB000;text-shadow:0 0 18px #FF8C00,0 0 36px #CC6600}
    .header p{margin-top:6px;font-size:13px;color:#8B6914;font-style:italic}
    .header .last-checked{font-size:11px;color:#4A3B1A;margin-top:4px}

    /* Overall banner */
    .overall{text-align:center;padding:20px;border-radius:8px;margin-bottom:32px;border:1px solid}
    .overall-text{font-size:16px;font-weight:500}
    .overall.operational{background:rgba(52,211,153,0.07);border-color:rgba(52,211,153,0.2)}
    .overall.operational .overall-text{color:#34d399;text-shadow:0 0 12px rgba(52,211,153,0.4)}
    .overall.degraded{background:rgba(251,191,36,0.07);border-color:rgba(251,191,36,0.2)}
    .overall.degraded .overall-text{color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,0.4)}
    .overall.major_outage{background:rgba(248,113,113,0.07);border-color:rgba(248,113,113,0.2)}
    .overall.major_outage .overall-text{color:#f87171;text-shadow:0 0 12px rgba(248,113,113,0.4)}

    /* Legend */
    .legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;font-size:11px;color:#8B6914}
    .legend-item{display:flex;align-items:center;gap:4px}
    .legend-dot{width:10px;height:10px;border-radius:2px;display:inline-block}

    /* Service cards */
    .service{margin-bottom:28px}
    .service-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap;gap:8px}
    .service-name{font-size:14px;font-weight:500;color:#FFB000;text-shadow:0 0 8px rgba(255,140,0,0.3)}
    .service-desc{display:block;font-size:12px;color:#8B6914;margin-top:2px;font-style:italic}
    .status-badge{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
    .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
    .status-operational{color:#FFB000}.status-operational .status-dot{background:#FFB000;box-shadow:0 0 8px rgba(255,176,0,0.6)}
    .status-degraded{color:#fbbf24}.status-degraded .status-dot{background:#fbbf24;box-shadow:0 0 8px rgba(251,191,36,0.6)}
    .status-down{color:#FF3300}.status-down .status-dot{background:#FF3300;box-shadow:0 0 8px rgba(255,51,0,0.6)}

    /* Bar chart */
    .uptime-grid{display:flex;gap:1.5px;height:28px;align-items:stretch}
    .bar{flex:1;border-radius:2px;min-width:0;transition:opacity 0.15s}
    .bar:hover{opacity:0.7}
    .uptime-footer{display:flex;justify-content:space-between;font-size:11px;color:#4A3B1A;margin-top:4px}
    .uptime-pct{font-weight:500;color:#8B6914}

    /* Section titles */
    .section-title{font-size:16px;font-weight:600;color:#FFB000;margin:40px 0 16px;padding-top:20px;border-top:1px solid rgba(139,105,20,0.2);text-shadow:0 0 10px rgba(255,140,0,0.2)}
    .section-runes{font-size:12px;color:#8B6914;letter-spacing:0.3em;margin-bottom:4px;user-select:none}

    /* Incidents */
    .incident{margin-bottom:16px;padding:12px;border-radius:6px;border:1px solid rgba(139,105,20,0.15);background:rgba(15,23,42,0.5)}
    .incident-header{display:flex;align-items:center;gap:8px;font-size:13px;color:#FFB000}
    .incident-date{margin-left:auto;font-size:12px;color:#8B6914}
    .incident-update{font-size:12px;color:#8B6914;margin-top:6px;padding-left:14px;border-left:2px solid rgba(139,105,20,0.2)}
    .incident-update-time{color:#4A3B1A;margin-right:4px}
    .no-incidents{font-size:13px;color:#4A3B1A;font-style:italic}

    /* Footer */
    .footer{text-align:center;padding:40px 0 20px;font-size:12px;color:#334155}
    .raven-ascii{font-size:9px;color:#2a2a1e;line-height:1.1;margin-bottom:16px;user-select:none;white-space:pre}
    .footer a{color:#4A3B1A;text-decoration:none}
    .footer a:hover{color:#FFB000;text-shadow:0 0 8px rgba(255,140,0,0.3)}

    /* Error state */
    .error-state{text-align:center;padding:60px 20px;color:#FF3300;text-shadow:0 0 20px rgba(255,51,0,0.4)}
    .error-state .glitch{font-size:18px;animation:glitch 0.3s infinite}
    @keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(-2px,-2px)}60%{transform:translate(2px,2px)}80%{transform:translate(2px,-2px)}100%{transform:translate(0)}}

    /* Loading shimmer */
    .loading{text-align:center;padding:40px;color:#8B6914;font-size:14px}
    .loading-dots::after{content:'';animation:dots 1.5s steps(4,end) infinite}
    @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:''}}

    @media(max-width:480px){
      .container{padding:16px 10px}
      .header{padding:24px 0 20px}
      .header h1{font-size:18px}
      .legend{gap:10px}
      .service-header{flex-direction:column;gap:4px}
    }
  </style>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="container" id="app">
    <div class="loading">
      <span class="loading-dots">Consulting the Norns</span>
    </div>
  </div>

  <script>
  (function(){
    var APP = document.getElementById('app');
    var serviceOrder = ['coresapian','godot_game','anonymous_chat','starpark','plonk','njorun'];
    var statusLabels = {operational:'Operational',degraded:'Degraded',down:'Down',major_outage:'Major Outage'};
    var overallLabels = {operational:'All Systems Operational',degraded:'Some Systems Degraded',major_outage:'Major Service Disruption'};
    var statusClasses = {operational:'status-operational',degraded:'status-degraded',down:'status-down'};
    var barColors = {true:'#FFB000',false:'#FF3300'};
    var noDataColor = '#1a1a2e';

    function fmtDate(iso){
      try {
        var d = new Date(iso);
        return d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric'});
      } catch(e){ return iso; }
    }

    function barTitle(d,up){
      return fmtDate(d) + ': ' + (up ? '100% operational' : 'Degraded or down');
    }

    function buildHTML(data){
      var h = '';
      var overall = data.overall || 'operational';
      var lastChecked = data.last_checked || '';

      // Header
      h += '<div class="header">';
      h += '<div class="runes-header">&#5794;&#5855;&#5840;&#5800;&#5795;&#5794;&#5793;&#5810;&#5794;&#5855;&#5807;&#5845;&#5817;&#5848;</div>';
      h += '<h1>Coresapian Status</h1>';
      h += '<p>The Norns&rsquo; Loom &mdash; Watching the Threads of Wyrd</p>';
      h += '<div class="last-checked" id="last-checked">Last checked ' + (lastChecked ? new Date(lastChecked).toLocaleString() : '--') + '</div>';
      h += '</div>';

      // Overall banner
      h += '<div class="overall ' + overall + '">';
      h += '<span class="overall-text">' + (overallLabels[overall] || 'Status Unknown') + '</span>';
      h += '</div>';

      // Legend
      h += '<div class="legend">';
      h += '<div class="legend-item"><span class="legend-dot" style="background:#FFB000;box-shadow:0 0 6px rgba(255,176,0,0.4)"></span> Operational</div>';
      h += '<div class="legend-item"><span class="legend-dot" style="background:#fbbf24"></span> Degraded</div>';
      h += '<div class="legend-item"><span class="legend-dot" style="background:#FF3300;box-shadow:0 0 6px rgba(255,51,0,0.4)"></span> Down</div>';
      h += '<div class="legend-item"><span class="legend-dot" style="background:#1a1a2e"></span> No data</div>';
      h += '</div>';

      // Services
      var svcs = data.services || {};
      for (var i = 0; i < serviceOrder.length; i++){
        var id = serviceOrder[i];
        var svc = svcs[id];
        if (!svc) continue;
        var status = svc.status || 'operational';
        var sc = statusClasses[status] || 'status-operational';
        h += '<div class="service">';
        h += '<div class="service-header">';
        h += '<div><span class="service-name">' + esc(svc.name) + '</span><span class="service-desc">' + esc(svc.desc) + '</span></div>';
        h += '<div class="status-badge ' + sc + '"><span class="status-dot"></span>' + (statusLabels[status] || status) + '</div>';
        h += '</div>';

        // Bars
        var bars = svc.bars || [];
        h += '<div class="uptime-grid">';
        if (bars.length === 0){
          for (var b = 0; b < 90; b++){
            h += '<div class="bar" style="background:' + noDataColor + '" title="No data"></div>';
          }
        } else {
          for (var b = 0; b < bars.length; b++){
            var up = bars[b].up;
            var color = up !== undefined ? (up ? barColors['true'] : barColors['false']) : noDataColor;
            h += '<div class="bar" style="background:' + color + '" title="' + esc(barTitle(bars[b].date, up)) + '"></div>';
          }
        }
        h += '</div>';

        var pct = svc.uptime_90d !== undefined ? svc.uptime_90d.toFixed(2) : '--';
        h += '<div class="uptime-footer">';
        h += '<span>' + (bars.length > 0 ? '90 days ago' : 'No history') + '</span>';
        h += '<span class="uptime-pct">' + pct + '% uptime</span>';
        h += '<span>Today</span>';
        h += '</div>';
        h += '</div>';
      }

      // Incidents
      h += '<div class="section-title">';
      h += '<div class="section-runes">&#5806;&#5840;&#5796;&#5845;&#5795;&#5845;&#5793;&#5804;&#5794;&#5810;&#5807;&#5848;</div>';
      h += 'Urd&rsquo;s Basin &mdash; Past Incidents';
      h += '</div>';
      var incidents = data.incidents || [];
      if (incidents.length === 0){
        h += '<p class="no-incidents">No incidents reported. The Norns are at peace.</p>';
      } else {
        for (var i = 0; i < incidents.length; i++){
          var inc = incidents[i];
          h += '<div class="incident">';
          h += '<div class="incident-header">';
          h += '<span>' + esc(inc.title || 'Incident') + '</span>';
          h += '<span class="incident-date">' + fmtDate(inc.date) + '</span>';
          h += '</div>';
          if (inc.updates){
            for (var u = 0; u < inc.updates.length; u++){
              var upd = inc.updates[u];
              h += '<div class="incident-update"><span class="incident-update-time">' + esc(upd.time || '') + '</span>' + esc(upd.text || '') + '</div>';
            }
          }
          h += '</div>';
        }
      }

      // Footer
      h += '<div class="footer">';
      h += '<pre class="raven-ascii">         ,_\n       ,\'  `.\n      /  _   \\\n      : ,\' `. :\n      | |   | |\n      : ;   ; ;\n       \\ \\ / /\n        `. .\'\n          `</pre>';
      h += 'Powered by <a href="https://coresapian.com">Coresapian Inc</a> &middot; The Norns Weave';
      h += '</div>';

      return h;
    }

    function esc(s){
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showError(msg){
      APP.innerHTML = '<div class="error-state"><div class="glitch">&#9888; ' + esc(msg) + '</div><p style="color:#8B6914;margin-top:16px;font-size:13px">The Loom is tangled &mdash; unable to read the threads. Retrying in 30 seconds.</p></div>';
    }

    function fetchStatus(){
      fetch('status.json?' + Date.now())
        .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(data){
          APP.innerHTML = buildHTML(data);
        })
        .catch(function(e){
          showError(e.message || 'Connection failed');
        });
    }

    fetchStatus();
  })();
  </script>
</body>
</html>
