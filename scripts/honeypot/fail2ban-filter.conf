# Fail2Ban filter — coresapian honeypot canary paths
# Install to: /etc/fail2ban/filter.d/coresapian-honeypot.conf
#
# Matches ANY request (GET/POST/HEAD/PUT/DELETE) to canary Disallow paths
# defined in the site's robots.txt. Zero false-positive rate — no legitimate
# user or crawler should ever touch these.

[Definition]
failregex = ^<HOST> \- \S+ \[.*\] "(GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /(admin-backup-2024|db-dump|secure-login|\.env\.backup|wp-admin|users-export\.sql|staging-admin|config-backup|phpmyadmin|super-admin-panel)\b.*HTTP/\S+" \d+ \d+

ignoreregex =

# Dev notes:
# - <HOST> captures the attacker IP automatically
# - \b after path prevents partial matches on legitimate URLs
# - All HTTP methods covered — attackers often POST to wp-admin etc.
