# Fail2Ban jail — coresapian honeypot
# Install to: /etc/fail2ban/jail.d/coresapian-honeypot.conf
#
# Single hit to any canary = instant 7-day ban.
# These paths have zero legitimate traffic.
#
# NOTE: Update ignoreip if your public IP changes.
# Consider using dynamic DNS hostname instead.

[coresapian-honeypot]
enabled   = true
filter    = coresapian-honeypot
logpath   = /var/log/nginx/honeypot-access.log
backend   = polling
banaction = iptables-multiport
maxretry  = 1
findtime  = 86400
bantime   = 604800
port      = http,https
action    = coresapian-honeypot-alert
ignoreip  = 127.0.0.1/8
           192.168.0.0/24

# Optional: send notification on ban (requires action config)
# action   = %(banaction)s[name=%(__name__)s, bantime="%(bantime)s", port="%(port)s", protocol="tcp", chain="%(chain)s"]
#            coresapian-honeypot-alert[name=%(__name__)s]
