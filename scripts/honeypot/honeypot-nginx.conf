# ─────────────────────────────────────────────────────────
# Honeypot nginx config for coresapian.com
# Deploy to /etc/nginx/sites-available/coresapian on LXC 103
#
# LXC 103, IP 192.168.0.148
# Web root: /var/www/coresapian
# TLS handled by Cloudflare Tunnel (listen 80 only)
# Godot .wasm/.pck files with COOP/COEP headers
# WebSocket proxies: /ws/world-chat, /ws/enet, /chat
#
# Canary paths from robots.txt Disallow rules.
# Any hit = logged to dedicated honeypot log + tarpitted.
# Fail2Ban watches the log and bans on first hit.
# ─────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name coresapian.com www.coresapian.com game.coresapian.com coreserve.coresapian.com;

    root /var/www/coresapian;
    index index.html;
    error_page 404 /404.html;

    # COOP/COEP headers for SharedArrayBuffer (Godot Web)
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Main site
    location / {
        try_files $uri $uri/ =404;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Godot .wasm/.pck files — long-lived cache + COOP/COEP
    location ~* \.(wasm|pck)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # World chat WebSocket proxy (Python server on port 8765)
    location /ws/world-chat {
        proxy_pass http://127.0.0.1:8765/ws/world-chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ENet WebSocket relay proxy (Python server on port 7000)
    location /ws/enet {
        proxy_pass http://127.0.0.1:7000/ws/enet;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # coreChat IRC client (Node.js on port 9000)
    location /chat {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ══════════════════════════════════════════════════════
    #  HONEYPOT — Canary paths from robots.txt
    #  1 byte/sec tarpit + dedicated log for Fail2Ban
    # ══════════════════════════════════════════════════════
    location ~ ^/(admin-backup-2024|db-dump|secure-login|\.env\.backup|wp-admin|users-export\.sql|staging-admin|config-backup|phpmyadmin|super-admin-panel) {
        access_log /var/log/nginx/honeypot-access.log;
        limit_rate 1;
        default_type text/html;
        return 200 "<!DOCTYPE html><html><head><title>Loading...</title></head><body style=\"background:#111;color:#666;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0\"><div>loading...</div></body></html>";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name status.coresapian.com;
    root /var/www/coresapian/status;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
