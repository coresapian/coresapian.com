# ─────────────────────────────────────────────────────────
# Honeypot nginx config for coresapian.com
# Deploy to /etc/nginx/sites-available/coresapian on LXC 103
#
# LXC 103, IP 192.168.0.148
# Web root: /var/www/coresapian
# TLS handled by Cloudflare Tunnel (listen 80 only)
# Godot .wasm/.pck files with COOP/COEP headers
# WebSocket proxy: /ws/chat
#
# Canary paths for honeypot tarpit.
# Any hit = logged to dedicated honeypot log + tarpitted.
# Fail2Ban watches the log and bans on first hit.
# ─────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name coresapian.com www.coresapian.com game.coresapian.com coreserve.coresapian.com;

    root /var/www/coresapian;
    index index.html;
    error_page 404 /404.html;

    # COOP/COEP/CORP headers for SharedArrayBuffer (Godot Web)
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Hide sensitive files ──────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(env|sql|bak|backup|dump|key|pem)$ {
        deny all;
        return 404;
    }

    # Main site
    location / {
        try_files $uri $uri/ =404;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Godot .wasm/.pck files — long-lived cache + COOP/COEP
    location ~* \.(wasm|pck)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Anonymous Chat WebSocket proxy (Node.js on port 3001)
    location /ws/chat {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ══════════════════════════════════════════════════════
    #  HONEYPOT — Canary paths
    #  1 byte/sec tarpit + dedicated log for Fail2Ban
    # ══════════════════════════════════════════════════════
    location ~ ^/(admin-backup|db-dump|secure-login|\.env\.backup|wp-admin|users-export\.sql|staging-admin|config-backup|phpmyadmin|super-admin-panel|wp-login|xmlrpc\.php|\.git/|\.svn/|server-status|cgi-bin|administrator) {
        access_log /var/log/nginx/honeypot-access.log;
        limit_rate 1;
        default_type text/html;
        return 200 "<!DOCTYPE html><html><head><title>Loading...</title></head><body style=\"background:#111;color:#666;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0\"><div>loading...</div></body></html>";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name status.coresapian.com;
    root /var/www/coresapian/status;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
