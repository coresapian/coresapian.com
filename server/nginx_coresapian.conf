# Coresapian.com — Nginx Configuration v2.0 for LXC 103
# Server path: /etc/nginx/sites-available/coresapian

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name coresapian.com www.coresapian.com game.coresapian.com coreserve.coresapian.com;
    root /var/www/coresapian;
    index index.html;

    # ── Security Headers ──────────────────────────────────────────
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Hide sensitive files ──────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(env|sql|bak|backup|dump|key|pem)$ {
        deny all;
        return 404;
    }

    # Web App Manifest — correct MIME type
    location = /manifest.json {
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "public, max-age=3600";
        default_type application/manifest+json;
    }

    # Sitemap & browserconfig
    location = /sitemap.xml {
        add_header Cross-Origin-Resource-Policy same-origin always;
        default_type application/xml;
    }
    location = /browserconfig.xml {
        add_header Cross-Origin-Resource-Policy same-origin always;
        default_type application/xml;
    }

    # Favicons — cache aggressively (1 year, immutable)
    location = /favicon.ico {
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /icons/ {
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "public, max-age=604800";
    }

    # Fonts — Google Fonts proxies, but local fonts need CORP
    location /game/fonts/ {
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # HTML files — never cache (ensures latest shell JS/CSS references)
    location ~* \.html$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # JS/CSS/MP3 — moderate cache (versioned via URL params for cache-busting)
    location ~* \.(js|css|mp3)$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Images — cache aggressively
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg)$ {
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Large engine assets — must-revalidate so new exports are always fetched
    location ~* \.(wasm|pck)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
    }

    # JSON files (status, etc.)
    location ~* \.json$ {
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "no-cache" always;
    }

    # ── Anonymous Chat WebSocket (Node.js on port 3001) ──────────
    location /ws/chat {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Multiplayer Orbs WebSocket (Node.js on port 8082) ────────
    location /ws/mp {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
