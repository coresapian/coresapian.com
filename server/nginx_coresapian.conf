# Coresapian.com — Nginx Configuration v2.1 for LXC 103
# Server path: /etc/nginx/sites-available/coresapian
#
# NOTE: this file is included from nginx.conf's http context, so the
# limit_conn_zone directive below is valid at the top level here.
#
# Per-IP WebSocket connection cap (relay DoS mitigation): 20 concurrent
# WS connections per client IP across the /ws* locations.
limit_conn_zone $binary_remote_address zone=ws:10m;
#
# v2.1 changelog:
#   - Added Strict-Transport-Security (HSTS) header
#   - Fixed nginx header inheritance: all location blocks now re-declare
#     every security header (nginx drops inheritance when any add_header
#     exists in a location block)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name coresapian.com www.coresapian.com game.coresapian.com coreserve.coresapian.com;

    # ── Real-IP restoration behind the Cloudflare Tunnel ─────────────
    # All production traffic arrives via cloudflared, which terminates
    # visitor TCP locally: nginx sees the tunnel's local endpoint, not the
    # visitor. Restore per-visitor $remote_addr from the edge-set
    # CF-Connecting-IP header so `limit_conn ws 20` keys per visitor again
    # (without this it is a site-wide ~10-user ceiling).
    # Trust the header ONLY because the origin is reachable solely via the
    # tunnel. If the origin ever accepts direct internet traffic, clients
    # could spoof it. Add any additional local cloudflared bind addresses
    # to set_real_ip_from below.
    set_real_ip_from 127.0.0.1/32;
    set_real_ip_from ::1/128;
    real_ip_header CF-Connecting-IP;

    root /var/www/coresapian;
    index index.html;
    error_page 404 /404.html;

    # ── Security Headers (server-level, inherited by location blocks ──
    #     that have NO add_header of their own) ─────────────────────────
    # NOTE: Any location block with its own add_header MUST re-declare
    #       ALL of these, because nginx drops inheritance in that case.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy — Godot WebGL:
    #   script-src — Godot JS needs eval + inline; Cloudflare bot protection injects inline scripts
    #   style-src — Google Fonts CSS + game-shell inline styles
    #   font-src — Google Fonts webfonts (Cinzel, Share Tech Mono)
    #   worker-src — Godot audio worklets via blob:
    #   connect-src — multiplayer WebSocket (wss:) + Cloudflare analytics
    #   img-src — favicon, generated textures, Cloudflare beacon
    #   frame-src — Cloudflare challenge iframe
    #   child-src — Cloudflare challenge iframe fallback
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; connect-src 'self' wss: ws: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https:; child-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    # ── Hide sensitive files ──────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(env|sql|bak|backup|dump|key|pem)$ {
        deny all;
        return 404;
    }

    # ── Heimdall telemetry + honeypot traps ───────────────────────────
    # Deploy must copy Heimdall/collector/nginx-telemetry-snippet.conf to
    # /etc/nginx/snippets/heimdall-telemetry.conf on the LXC, then
    # `nginx -t && nginx -s reload`. Placed AFTER the deny blocks above so
    # they keep precedence on dotfiles.
    include /etc/nginx/snippets/heimdall-telemetry.conf;

    # Web App Manifest — correct MIME type
    location = /manifest.json {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; connect-src 'self' wss: ws: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https:; child-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=3600";
        default_type application/manifest+json;
    }

    # Sitemap
    location = /sitemap.xml {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; connect-src 'self' wss: ws: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https:; child-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        default_type application/xml;
    }

    # browserconfig
    location = /browserconfig.xml {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; connect-src 'self' wss: ws: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https:; child-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        default_type application/xml;
    }

    # Favicons — cache aggressively (1 year, immutable)
    location = /favicon.ico {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; connect-src 'self' wss: ws: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https:; child-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /icons/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; connect-src 'self' wss: ws: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https:; child-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=604800";
    }

    # Fonts — Google Fonts proxies, but local fonts need CORP
    location /game/fonts/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; connect-src 'self' wss: ws: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https:; child-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # HTML files — never cache (ensures latest shell JS/CSS references)
    location ~* \.html$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; connect-src 'self' wss: ws: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https:; child-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # JS/CSS/MP3 — moderate cache (versioned via URL params for cache-busting)
    location ~* \.(js|css|mp3)$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; connect-src 'self' wss: ws: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https:; child-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Images — cache aggressively
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg)$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; connect-src 'self' wss: ws: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https:; child-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Large engine assets — must-revalidate so new exports are always fetched
    location ~* \.(wasm|pck)$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; connect-src 'self' wss: ws: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https:; child-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # JSON files
    location ~* \.json$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; connect-src 'self' wss: ws: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https:; child-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    # ── Chat WebSocket (merged into the unified relay on port 8082, v3) ──
    location /ws/chat {
        limit_conn ws 20;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Multiplayer Orbs WebSocket (Node.js on port 8082) ────────
    location /ws/mp {
        limit_conn ws 20;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Game client WebSocket: exact-match /ws → unified relay ──
    location = /ws {
        limit_conn ws 20;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
