# Coresapian.com - Nginx Configuration for LXC 103
# Reference copy - deploy via scripts/deploy_corechat.sh
# Server path: /etc/nginx/sites-available/coresapian

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name coresapian.com www.coresapian.com game.coresapian.com coreserve.coresapian.com;
    root /var/www/coresapian;
    index index.html;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(wasm|pck)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    # World chat WebSocket proxy (Python server on port 8765)
    location /ws/world-chat {
        proxy_pass http://127.0.0.1:8765/ws/world-chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ENet WebSocket relay proxy (Python server on port 7000)
    location /ws/enet {
        proxy_pass http://127.0.0.1:7000/ws/enet;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # coreChat IRC client (Node.js on port 9000)
    location /chat {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
