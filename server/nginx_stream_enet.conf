# Nginx TCP Stream Proxy for ENet Multiplayer (Godot Dedicated Server)
#
# This block goes in /etc/nginx/nginx.conf OUTSIDE the http {} block.
# It cannot go inside sites-available/ or conf.d/ because those are
# included within http {} — stream blocks are top-level.
#
# ENet (Godot's networking) uses both TCP and UDP on port 7000.
# This stream block handles TCP. For UDP you need a separate solution
# (e.g. socat, iptables DNAT, or nginx stream with ngx_stream_udp_module).
#
# After editing nginx.conf, test and reload:
#   sudo nginx -t && sudo systemctl reload nginx

stream {
    # ENet multiplayer - TCP proxy for Godot dedicated server
    upstream enet_tcp {
        server 127.0.0.1:7001;
    }

    server {
        listen 7000;
        listen [::]:7000;

        # TCP proxy to Godot dedicated server
        proxy_pass enet_tcp;

        # Timeouts tuned for long-lived game connections
        proxy_connect_timeout 5s;
        proxy_timeout 3600s;  # 1 hour — matches typical game session length

        # Optional: log stream connections
        # access_log /var/log/nginx/enet_stream_access.log;
        # error_log  /var/log/nginx/enet_stream_error.log;
    }
}

# --- IMPORTANT NOTES ---
#
# 1. INSERT INTO /etc/nginx/nginx.conf:
#    Place this stream {} block at the END of nginx.conf, after the
#    http {} block closes. Example structure:
#
#      user www-data;
#      worker_processes auto;
#      ...
#      events { ... }
#      http { ... }
#      stream {
#          upstream enet_tcp { ... }
#          server { ... }
#      }
#
# 2. UDP TRAFFIC:
#    Nginx stream module supports UDP with the "udp" parameter:
#      listen 7000 udp;
#    But ENet mixes TCP+UDP on the same port. You may need TWO server
#    blocks or let the Godot server handle UDP directly if the router
#    ever allows inbound traffic.
#
# 3. CURRENT LIMITATION:
#    The CenturyLink C3000Z router blocks all inbound ports. This proxy
#    config is ready for when port forwarding works or a static IP is
#    obtained. Until then, ENet multiplayer only works on LAN
#    (192.168.0.x:7000).
