# Fail2Ban jail — {{SITE_NAME}} honeypot canary paths
# Install to: /etc/fail2ban/jail.d/{{SITE_SLUG}}-honeypot.conf
#
# Single-hit canary: any request to a robots.txt Disallow canary path
# bans the IP for 7 days and fires the alert action. Zero false-positive
# rate — no legitimate user or crawler should ever touch these.

[{{SITE_SLUG}}-honeypot]
enabled = true
port = http,https
filter = {{SITE_SLUG}}-honeypot
action = {{SITE_SLUG}}-honeypot-alert
logpath = /var/log/nginx/{{SITE_SLUG}}*.log
         /var/log/nginx/access.log
maxretry = 1
findtime = 60
bantime = 604800
