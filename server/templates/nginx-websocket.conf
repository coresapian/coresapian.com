# {{SITE_NAME}} — unified relay websocket proxy snippet (v3)
#
# Include in the site's server block, e.g.:
#   include /etc/nginx/snippets/{{SITE_SLUG}}-relay.conf;
# Rendered by scripts/deploy-servers.sh — do not edit on the LXC.
#
# Single merged port serves both multiplayer positions and chat.
# /ws/chat is kept as an alias so old clients and cached pages keep
# working after the v3 merge. Exact-match /ws is the game client's
# endpoint (window.__MP_SERVER_URL = "<proto>//<host>/ws").

location /ws/mp {
    proxy_pass http://127.0.0.1:{{MP_PORT}};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /ws/chat {
    proxy_pass http://127.0.0.1:{{MP_PORT}};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /ws {
    proxy_pass http://127.0.0.1:{{MP_PORT}};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
